services:
  - type: web
    name: MCP-Ecom
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fulfillment-db
          property: connectionString

databases:
  - name: fulfillment-db
    databaseName: fulfillment_mcp
    user: fulfillment_user
    plan: free
